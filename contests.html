<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ANCC IITD - Contests</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="bg-animated" data-page="contests">
    <div class="particles" id="particles"></div>
    <div id="site-nav"></div>

    <header class="hero-section text-white">
      <h1 class="hero-title">Contests</h1>
      <p class="lead mt-3">Learn. Code. Win.</p>
      <hr>
      <div data-social-row></div>
    </header>

    <main class="container my-4">
      <div id="loading" class="text-center text-white">
        <div class="loading-spinner"></div>
        <p class="mt-3">Loading contests...</p>
      </div>
      <div id="contests" class="contests-container"></div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
    <script src="site.js"></script>

    <script>
      const CONTESTS_SHEET = 'https://docs.google.com/spreadsheets/d/11WJcJriYPu_jhhsVb1ov1kaajF-wn1cW8LwaVXdRHXA/export?format=tsv&gid=1138293335';

      function generateContest(c) {
        let card = "<div class='contest-card fade-in'>";
        card += "<div class='contest-header'><h5 class='contest-name'>" + (c['Name'] || '') + "</h5></div>";

        card += "<div class='contest-details'>";
        card += "<div class='detail-block'><div class='detail-label'>Starts on</div>";
        card += "<div class='detail-value'>" + (c['Start Date'] || '') + "</div>";
        card += "<div class='detail-value' style='font-size:0.9rem; margin-top:0.25rem;'>" + (c['Start Time'] || '') + "</div></div>";
        card += "<div class='detail-block'><div class='detail-label'>Duration</div>";
        card += "<div class='detail-value'>" + (c['Duration'] || '') + "</div></div>";
        card += "</div>";

        card += "<div class='contest-actions'>";
        if (c['Registration Link']) card += "<a href='" + c['Registration Link'] + "' target='_blank' rel='noopener' class='action-btn tertiary'><i class='fas fa-user-plus'></i> Register</a>";
        if (c['WhatsApp Group Link']) card += "<a href='" + c['WhatsApp Group Link'] + "' target='_blank' rel='noopener' class='action-btn whatsapp'><i class='fab fa-whatsapp'></i> WhatsApp Group</a>";
        if (c['Editorial Link']) card += "<a href='" + c['Editorial Link'] + "' target='_blank' rel='noopener' class='action-btn'><i class='fas fa-book'></i> Editorial</a>";
        if (c['Virtual Participation Link']) card += "<a href='" + c['Virtual Participation Link'] + "' target='_blank' rel='noopener' class='action-btn secondary'><i class='fas fa-play'></i> Virtual Participate</a>";
        card += "</div>";

        card += "</div>";
        return card;
      }

      async function loadContests() {
        try {
          const { records } = await fetchSheet(CONTESTS_SHEET);
          document.getElementById('loading').style.display = 'none';

          const container = document.getElementById('contests');
          container.innerHTML = records.map(generateContest).join('');
          container.classList.add('stagger-animation');
          container.querySelectorAll('.contest-card').forEach((card, i) => {
            card.style.animationDelay = (i * 0.1) + 's';
            card.style.transform = 'translateY(50px)';
          });
        } catch (e) {
          document.getElementById('loading').innerHTML = '<p class="text-danger">Could not load contests right now. Please try again later.</p>';
        }
      }

      document.addEventListener('DOMContentLoaded', loadContests);
    </script>
  </body>
</html>
