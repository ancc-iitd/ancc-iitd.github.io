<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ANCC IITD - CSOT 2026</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="bg-animated" data-page="csot">
    <div class="particles" id="particles"></div>
    <div id="site-nav"></div>

    <header class="hero-section text-white">
      <h1 class="hero-title">CSOT 2026</h1>
      <p class="lead mt-3">Algorithms &amp; CP Lecture Series · Summer 2026</p>
      <p class="mb-0">A lecture &amp; contest series building the foundations most tested in internship selection tests and competitive programming.</p>
      <div class="csot-actions">
        <a class="btn btn-primary" target="_blank" rel="noopener"
           href="https://www.youtube.com/playlist?list=PLghw1kkEm-HA8Fhy2ETAIf9crdRnyhyWp">
          <i class="fab fa-youtube me-2"></i>Full Playlist
        </a>
        <a class="btn btn-success" target="_blank" rel="noopener"
           href="https://github.com/ancc-iitd/CSOT-2026">
          <i class="fab fa-github me-2"></i>Course Materials
        </a>
      </div>
    </header>

    <main class="container my-4">
      <div id="modules"></div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
    <script src="site.js"></script>

    <script>
      const REPO_BASE = 'https://github.com/ancc-iitd/CSOT-2026/tree/main/';

      // Lecture data sourced from the CSOT-2026 repo README.
      const MODULES = [
        {
          badge: 'Module 1', title: 'Basics of CP',
          topics: 'STL, Math, Binary Search, Two Pointers, Greedy, Sorting',
          lectures: [
            { n: 1, date: 'May 27', title: 'STL, Complexity & Searching', yt: 'rAnkTs2GaZk', dir: 'MODULE 1 — BASICS OF CP/LECTURE1' },
            { n: 2, date: 'May 29', title: 'Prefix Sums, Two Pointers, Binary Search & Greedy', yt: 'K82KZz_3H7A', dir: 'MODULE 1 — BASICS OF CP/LECTURE2' },
          ],
        },
        {
          badge: 'Module 2', title: 'Number Theory',
          topics: 'GCD/LCM, Modular Arithmetic, Primes, Sieve',
          lectures: [
            { n: 3, date: 'May 31', title: 'GCD/LCM, Euclid & Modular Arithmetic', yt: '1PDKDmWR4gE', dir: 'MODULE 2 — NUMBER THEORY/LECTURE1' },
            { n: 4, date: 'Jun 1',  title: 'Primes, Sieve & Number Theory II',      yt: 'FZ-qH09M6Eg', dir: 'MODULE 2 — NUMBER THEORY/LECTURE2' },
          ],
        },
        {
          badge: 'Module 3', title: 'Dynamic Programming',
          topics: 'DP fundamentals, Bitmask DP, advanced problems',
          lectures: [
            { n: 5, date: 'Jun 5', title: 'DP Fundamentals',          yt: 'QMJG6FNPGNg', dir: 'MODULE 3 — DYNAMIC PROGRAMMING/LECTURE1' },
            { n: 6, date: 'Jun 8', title: 'DP II — Bitmask & Advanced', yt: 'AJOI4Vs5DgA', dir: 'MODULE 3 — DYNAMIC PROGRAMMING/LECTURE2' },
          ],
        },
        {
          badge: 'Module 4', title: 'Graphs & Trees',
          topics: 'BFS, DFS, Dijkstra’s Algorithm, DSU, Trees, LCA',
          lectures: [
            { n: 7, date: 'Jun 18', title: 'Graph Theory — BFS & DFS',      yt: '1KFWk5A0Xyw', dir: 'MODULE 4 — GRAPHS & TREES/LECTURE1' },
            { n: 8, date: 'Jun 20', title: 'Shortest Paths & Tree Diameter', yt: 'QR69WTR6IsY', dir: 'MODULE 4 — GRAPHS & TREES/LECTURE2' },
            { n: 9, date: 'Jun 22', title: 'MST & Topological Sort',         yt: '-HDNDy3Ph1c', dir: 'MODULE 4 — GRAPHS & TREES/LECTURE3' },
            { n: 10, tba: true },
            { n: 11, tba: true },
          ],
        },
        {
          badge: 'Module 5', title: 'Segment Trees & Fenwick Trees',
          topics: 'Segment Trees, Fenwick Trees',
          lectures: [
            { n: 12, tba: true },
            { n: 13, tba: true },
            { n: 14, tba: true },
          ],
        },
      ];

      function repoUrl(dir) {
        return REPO_BASE + dir.split('/').map(encodeURIComponent).join('/');
      }

      function lectureCard(lec) {
        if (lec.tba) {
          return `<div class="custom-card lecture-card upcoming fade-in">
                    <div class="upcoming-inner">
                      <div class="upcoming-n">Lecture ${lec.n}</div>
                      <div>Coming soon</div>
                    </div>
                  </div>`;
        }
        return `<div class="custom-card lecture-card fade-in">
                  <div class="yt-embed" data-id="${lec.yt}"></div>
                  <div class="card-body">
                    <div class="lecture-meta">Lecture ${lec.n} · ${lec.date}</div>
                    <h5 class="card-title">${lec.title}</h5>
                    <div class="lecture-links">
                      <a class="action-btn" target="_blank" rel="noopener" href="https://youtu.be/${lec.yt}">
                        <i class="fas fa-external-link-alt"></i> Watch on YouTube
                      </a>
                      <a class="action-btn secondary" target="_blank" rel="noopener" href="${repoUrl(lec.dir)}">
                        <i class="fas fa-folder-open"></i> Materials
                      </a>
                    </div>
                  </div>
                </div>`;
      }

      function renderModules() {
        document.getElementById('modules').innerHTML = MODULES.map(m => `
          <section class="module-section">
            <div class="module-head">
              <span class="module-badge">${m.badge}</span>
              <span class="module-title">${m.title}</span>
              <span class="module-topics">${m.topics}</span>
            </div>
            <div class="lecture-grid">
              ${m.lectures.map(lectureCard).join('')}
            </div>
          </section>`).join('');
      }

      // Swap the thumbnail facade for the real player only when clicked.
      function setupYouTubeFacades() {
        document.querySelectorAll('.yt-embed[data-id]').forEach(el => {
          const id = el.dataset.id;
          el.style.backgroundImage = `url(https://i.ytimg.com/vi/${id}/hqdefault.jpg)`;
          el.insertAdjacentHTML('beforeend', '<button class="yt-play" aria-label="Play video"><i class="fas fa-play"></i></button>');
          el.addEventListener('click', () => {
            el.classList.add('playing');
            el.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0"
              title="CSOT 2026 lecture" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen></iframe>`;
          }, { once: true });
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        renderModules();
        setupYouTubeFacades();
      });
    </script>
  </body>
</html>
