<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ANCC IITD</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <!-- Fonts & icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Shared styles -->
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="bg-animated" data-page="home">
    <div class="particles" id="particles"></div>

    <!-- Navbar (injected by site.js) -->
    <div id="site-nav"></div>

    <header class="hero-section text-white">
      <h1 class="hero-title">Algorithms and Coding Club<br>IIT Delhi</h1>
      <div class="sponsored-by">
        Powered by <span id="sponsor-text"></span><span class="blink">|</span>
      </div>
      <hr>
      <div data-social-row></div>
    </header>

    <main class="container my-4">
      <div class="custom-card text-white mx-auto" style="max-width: 720px;">
        <div class="card-header-custom">
          <h3>The ANCC Competitive Programming Guide</h3>
        </div>
        <div class="card-body text-center">
          <h5 class="card-title">Looking for resources to learn competitive programming?</h5>
          <p class="card-text">We have curated the best resources to get you started and master competitive programming.</p>
          <a target="_blank" rel="noopener" href="https://ancc-iitd.github.io/competitive-programming-resources" class="btn btn-primary mt-2">View</a>
        </div>
      </div>

      <h1 id="teamH" class="text-center text-white my-5" style="display: none;">Our Team</h1>

      <div id="loading" class="text-center text-white">
        <div class="loading-spinner"></div>
        <p class="mt-3">Loading our amazing team...</p>
      </div>

      <div id="team" class="team-container"></div>
    </main>

    <!-- Footer (injected by site.js) -->
    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
    <script src="site.js"></script>

    <script>
      const TEAM_SHEET = 'https://docs.google.com/spreadsheets/d/16Gp1oacm_Nwp8ZH8F8RqVIE5MMwMjYp7Z7IIYruwI78/export?format=tsv&gid=484472445';

      function showSponsor() {
        const el = document.getElementById('sponsor-text');
        if (el) el.innerHTML = '<span class="sponsor-text">Jump</span><span class="trading-text"> Trading</span>';
        const blink = document.querySelector('.blink');
        if (blink) blink.style.display = 'none';
      }

      document.addEventListener('DOMContentLoaded', () => {
        showSponsor();
        loadTeam(TEAM_SHEET);
      });
    </script>
  </body>
</html>
