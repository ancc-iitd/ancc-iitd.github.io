<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>SoCP | ANCC IITD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="bg-animated" data-page="socp">
    <div class="particles" id="particles"></div>
    <div id="site-nav"></div>

    <header class="hero-section text-white">
      <h1 class="hero-title">Summer of Competitive Programming</h1>
      <hr>
      <p class="lead">Join the summer fun today!</p>
      <div class="mt-3">
        <span style="font-size: 1.4rem; font-weight: 600;">Learn</span>
        <span class="header-sub-title" id="word">coding</span>
        <span class="blink">|</span>
      </div>
      <div class="mt-3" data-social-row></div>
    </header>

    <main class="container my-4 stars">
      <div id="stars"></div>

      <div id="loading" class="text-white" style="display: none;">
        <div class="spinner-border-custom mb-3"></div>
        <p>Loading events...</p>
      </div>

      <h1 id="eventsH" class="text-center text-white mb-5" style="display: none;">Events</h1>
      <div id="events" class="events-container stagger-animation"></div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
    <script src="site.js"></script>

    <script>
      const SOCP_SHEET = 'https://docs.google.com/spreadsheets/d/11WJcJriYPu_jhhsVb1ov1kaajF-wn1cW8LwaVXdRHXA/export?format=tsv&gid=843127773';

      function typeWriter() {
        const words = ['algorithms', 'data structures', 'problem solving', 'coding', 'programming'];
        let wordIndex = 0, charIndex = 0, isDeleting = false;
        const el = document.getElementById('word');

        function type() {
          const word = words[wordIndex];
          el.textContent = word.substring(0, isDeleting ? charIndex - 1 : charIndex + 1);
          charIndex += isDeleting ? -1 : 1;

          let speed = isDeleting ? 75 : 150;
          if (!isDeleting && charIndex === word.length) { speed = 2000; isDeleting = true; }
          else if (isDeleting && charIndex === 0) { isDeleting = false; wordIndex = (wordIndex + 1) % words.length; speed = 500; }
          setTimeout(type, speed);
        }
        type();
      }

      function generateEventCard(date, title, desc, mainLink, suppLink, imgSrc, imgLink) {
        let card = "<div class='custom-card fade-in'>";
        if (date) card += "<div class='card-header-custom'>" + date + "</div>";
        if (imgLink) card += "<a target='_blank' rel='noopener' href='" + imgLink + "'>";
        if (imgSrc) card += "<img src='" + imgSrc + "' class='card-img-top' style='height:200px; object-fit:cover;'>";
        if (imgLink) card += "</a>";

        card += "<div class='card-body'>";
        if (title) card += "<h5 class='card-title'>" + title + "</h5>";
        if (desc) card += "<p class='card-text'>" + desc + "</p>";
        if (mainLink || suppLink) {
          card += "<div class='btn-group'>";
          if (mainLink) card += "<a target='_blank' rel='noopener' href='" + mainLink + "' class='btn btn-primary'>Session Link</a>";
          if (suppLink) card += "<a target='_blank' rel='noopener' href='" + suppLink + "' class='btn btn-success'>Notes</a>";
          card += "</div>";
        }
        card += "</div></div>";
        return card;
      }

      async function getEvents() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';
        try {
          const { cells } = await fetchSheet(SOCP_SHEET);
          loading.style.display = 'none';
          document.getElementById('eventsH').style.display = 'block';

          const html = cells
            .filter(cols => cols.length >= 1 && cols[0].trim() !== '')
            .map(cols => generateEventCard(cols[0], cols[1], cols[2], cols[3], cols[4], cols[5], cols[6]))
            .join('');

          const events = document.getElementById('events');
          events.innerHTML = html;
          events.querySelectorAll('.custom-card').forEach((card, i) => {
            card.style.animationDelay = (i * 0.1) + 's';
            card.style.transform = 'translateY(50px)';
          });
        } catch (e) {
          loading.style.display = 'none';
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        typeWriter();
        getEvents();
      });
    </script>
  </body>
</html>
