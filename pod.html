<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ANCC IITD - Problem of the Day</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="bg-animated" data-page="pod">
    <div class="particles" id="particles"></div>
    <div id="site-nav"></div>

    <header class="hero-section text-white">
      <h1 class="hero-title">Problem of the Day</h1>
      <p class="lead mt-3">Daily coding challenges to sharpen your skills</p>
      <hr>
      <div data-social-row></div>
    </header>

    <main class="container my-4">
      <div id="loading" class="text-center text-white">
        <div class="loading-spinner"></div>
        <p class="mt-3">Loading problems...</p>
      </div>
      <div id="problems-container"></div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" crossorigin="anonymous"></script>
    <script src="site.js"></script>

    <script>
      const POD_SHEET = 'https://docs.google.com/spreadsheets/d/11WJcJriYPu_jhhsVb1ov1kaajF-wn1cW8LwaVXdRHXA/export?format=tsv&gid=0';

      function generateProblemCard(problem) {
        const formattedDate = new Date(problem.Date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        return `
          <div class="problem-card fade-in">
            <div class="problem-header">
              <div class="problem-info">
                <h5 class="problem-name">${problem.Name}</h5>
                <div class="problem-date">${formattedDate}</div>
              </div>
              <div class="problem-actions">
                <a href="${problem.ProblemLink}" target="_blank" rel="noopener" class="action-btn">
                  <i class="fas fa-external-link-alt"></i> Problem
                </a>
                ${problem.SolutionLink ? `
                  <a href="${problem.SolutionLink}" target="_blank" rel="noopener" class="action-btn secondary">
                    <i class="fas fa-lightbulb"></i> Solution
                  </a>` : ''}
              </div>
            </div>
          </div>`;
      }

      function toggleMonthDropdown(header) {
        const content = header.nextElementSibling;
        const toggle = header.querySelector('.month-toggle');
        content.classList.toggle('show');
        toggle.classList.toggle('rotated');
      }

      function generateMonthDropdown(month, problems) {
        const count = problems.length;
        return `
          <div class="month-dropdown">
            <div class="month-header" onclick="toggleMonthDropdown(this)">
              <h2>${month}<span class="problems-count">${count} problem${count !== 1 ? 's' : ''}</span></h2>
              <div class="month-toggle"><i class="fas fa-chevron-down"></i></div>
            </div>
            <div class="month-content">
              ${problems.map(generateProblemCard).join('')}
            </div>
          </div>`;
      }

      async function loadProblems() {
        try {
          const { records } = await fetchSheet(POD_SHEET);
          document.getElementById('loading').style.display = 'none';

          const problems = records.filter(p => p.Date);

          const byMonth = {};
          problems.forEach(p => {
            const monthYear = new Date(p.Date).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
            (byMonth[monthYear] = byMonth[monthYear] || []).push(p);
          });

          const months = Object.keys(byMonth).sort((a, b) => new Date(b) - new Date(a));
          months.forEach(m => byMonth[m].sort((a, b) => new Date(b.Date) - new Date(a.Date)));

          document.getElementById('problems-container').innerHTML =
            months.map(m => generateMonthDropdown(m, byMonth[m])).join('');

          const first = document.querySelector('.month-dropdown .month-header');
          if (first) toggleMonthDropdown(first);
        } catch (e) {
          document.getElementById('loading').innerHTML =
            `<div class="text-danger"><p>Error loading problems. Please try again later.</p></div>`;
        }
      }

      document.addEventListener('DOMContentLoaded', loadProblems);
    </script>
  </body>
</html>
